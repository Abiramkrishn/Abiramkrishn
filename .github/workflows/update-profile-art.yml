name: Update Profile Art

on:
  schedule:
    - cron: "17 6 * * *"   # Runs daily at 06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python fetch_contributions.py
      - run: python render_heatmap_svg.py data/contributions.json contrib-heatmap.svg
      - run: python render_stats_svg.py data/contributions.json telemetry.svg
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph & stats [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg telemetry.svg"
